<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITZY Line Distribution Studio Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #08080a; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; }
    header { width: 100%; background: #111116; border-bottom: 1px solid #222; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .brand { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand span { background: #ff0055; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; }
    .top-actions { display: flex; gap: 10px; }
    button { background: #22222e; color: #fff; border: 1px solid #333344; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
    button:hover { background: #333346; border-color: #555577; }
    .btn-accent { background: #ff0055; border-color: #ff0055; }
    .btn-accent:hover { background: #e0004c; }
    .app-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 1100px; }
    .edit-bar { width: 100%; background: #14141c; border: 1px solid #282838; border-radius: 10px; padding: 12px 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 0.65rem; text-transform: uppercase; color: #8888a0; font-weight: 700; letter-spacing: 1px; }
    .input-group input { background: #09090d; border: 1px solid #333348; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; outline: none; }
    .viewport { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #222; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); }
    .style-itzy-canvas { width: 100%; height: 100%; background: #dedede; color: #111; position: relative; display: flex; }
    .itzy-left-panel { width: 360px; height: 94%; background: #fdfdfd; margin: 15px; border-radius: 36px; padding: 24px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; z-index: 10; }
    .itzy-badge-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .itzy-logo-box { width: 50px; height: 50px; border-radius: 12px; background: #181818; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; letter-spacing: 1px; }
    .itzy-now-playing { background: #ffffff; padding: 8px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: #111; }
    .itzy-group-title { font-size: 1.3rem; font-weight: 900; letter-spacing: 12px; text-align: center; margin-bottom: 20px; color: #111; text-transform: uppercase; }
    .itzy-members-list { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .itzy-member-item { display: flex; align-items: center; justify-content: space-between; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
    .itzy-mem-info { display: flex; align-items: center; gap: 12px; }
    .itzy-mem-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: transparent; }
    .itzy-member-item.is-singing .itzy-mem-avatar { box-shadow: 0 0 0 3px #ff0055, 0 0 15px rgba(255, 0, 85, 0.5); }
    .itzy-mem-name { font-weight: 900; font-size: 1.05rem; color: #111; line-height: 1; text-transform: uppercase; }
    .itzy-mem-sub { font-size: 0.68rem; color: #777; font-weight: 700; text-transform: uppercase; }
    .itzy-time-pill { background: #232326; color: #fff; padding: 7px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 800; min-width: 60px; text-align: center; }
    .itzy-footer-label { text-align: center; font-size: 0.8rem; font-weight: 900; letter-spacing: 4px; color: #111; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; }
    .itzy-main-content { flex: 1; position: relative; height: 100%; }
    .itzy-video-circle { position: absolute; top: -30px; right: -30px; width: 500px; height: 500px; border-radius: 50%; overflow: hidden; border: 8px solid #ffffff; box-shadow: 0 15px 40px rgba(0,0,0,0.15); background: #111; }
    .itzy-video-circle video { width: 100%; height: 100%; object-fit: cover; }
    .itzy-chat-container { position: absolute; top: 180px; right: 340px; display: flex; flex-direction: column; gap: 12px; z-index: 15; }
    .itzy-chat-bubble { background: #ffffff; padding: 12px 22px; border-radius: 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); opacity: 0; transform: translateX(-15px); transition: all 0.3s ease; }
    .itzy-chat-bubble.visible { opacity: 1; transform: translateX(0); }
    .itzy-chat-bubble img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .itzy-chat-text { font-size: 0.85rem; font-weight: 900; color: #111; text-transform: uppercase; }
    .itzy-chat-sub { font-size: 0.72rem; color: #666; font-weight: 700; text-transform: uppercase; }
    .itzy-bottom-card { position: absolute; bottom: 20px; right: 20px; width: 540px; height: 280px; background: #111; border-radius: 28px; overflow: hidden; display: flex; align-items: flex-end; justify-content: flex-end; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); }
    .itzy-vocalist-cutout { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s ease; z-index: 1; }
    .itzy-vocalist-cutout.visible { opacity: 0.9; }
    .itzy-bottom-text { position: relative; z-index: 5; text-align: right; }
    .itzy-song-title { font-size: 4.5rem; font-weight: 900; text-transform: uppercase; color: #ffffff; text-shadow: 0 4px 20px rgba(0,0,0,0.8); line-height: 0.9; letter-spacing: 2px; }
    .itzy-tags { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    .itzy-tag-black { background: #000; color: #fff; font-weight: 900; padding: 7px 18px; border-radius: 20px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .itzy-tag-beige { background: #d8c8b8; color: #111; font-weight: 900; padding: 7px 18px; border-radius: 20px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .full-timeline-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(0, 0, 0, 0.4); z-index: 30; display: flex; cursor: pointer; }
    .timeline-segment { height: 100%; position: absolute; top: 0; }
    .timeline-playhead { position: absolute; top: -2px; width: 4px; height: 14px; background: #fff; box-shadow: 0 0 8px #000; z-index: 40; transform: translateX(-50%); }
    .controls-panel { width: 100%; background: #111118; border: 1px solid #222230; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <header>
    <div class="brand">ITZY LINE DISTRIBUTION <span>STUDIO</span></div>
    <div class="top-actions">
      <button onclick="document.getElementById('video-uploader').click()" class="btn-accent">📹 Upload MP4 Video</button>
      <input type="file" id="video-uploader" accept="video/mp4" style="display:none;" onchange="loadVideo(event)">
    </div>
  </header>

  <div class="app-container">
    <div class="edit-bar">
      <div class="input-group"><label>Badge Logo</label><input type="text" id="in-badge" value="ITZY" oninput="updateText()"></div>
      <div class="input-group"><label>Now Playing Text</label><input type="text" id="in-nowplaying" value="ITZY - UNTOUCHABLE" oninput="updateText()"></div>
      <div class="input-group"><label>Group Name</label><input type="text" id="in-group" value="I T Z Y" oninput="updateText()"></div>
      <div class="input-group"><label>Song Title</label><input type="text" id="in-title" value="UNTOUCHABLE" oninput="updateText()"></div>
      <div class="input-group"><label>Bottom Tag</label><input type="text" id="in-tag" value="LINE DISTRIBUTION" oninput="updateText()"></div>
    </div>

    <div class="viewport" id="viewport">
      <div class="style-itzy-canvas" id="layout-itzy">
        <div class="itzy-left-panel">
          <div class="itzy-badge-header">
            <div class="itzy-logo-box" id="display-badge">ITZY</div>
            <div class="itzy-now-playing">
              <span style="font-size:0.65rem; color:#888; display:block;">NOW PLAYING</span>
              <span id="display-nowplaying">ITZY - UNTOUCHABLE</span>
            </div>
          </div>
          <div class="itzy-group-title" id="display-group">I T Z Y</div>
          <div class="itzy-members-list" id="itzy-stage"></div>
          <div class="itzy-footer-label" id="display-footer">ITZY</div>
        </div>

        <div class="itzy-main-content">
          <div class="itzy-video-circle">
            <video id="itzy-video" loop muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
          </div>
          <div class="itzy-chat-container">
            <div class="itzy-chat-bubble" id="itzy-chat-card">
              <img id="itzy-chat-img" src="" alt="User">
              <div>
                <div class="itzy-chat-text" id="itzy-chat-name">CHAERYEONG</div>
                <div class="itzy-chat-sub" id="itzy-chat-text">STAN CHAERYEONG!</div>
              </div>
            </div>
          </div>
          <div class="itzy-bottom-card">
            <img class="itzy-vocalist-cutout" id="itzy-cutout-img" src="" alt="Vocalist">
            <div class="itzy-bottom-text">
              <div class="itzy-song-title" id="display-title">UNTOUCHABLE</div>
              <div class="itzy-tags">
                <div class="itzy-tag-black" id="display-tag-group">ITZY</div>
                <div class="itzy-tag-beige" id="display-tag">LINE DISTRIBUTION</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="full-timeline-bar" id="full-timeline" oncontextmenu="return false;">
        <div class="timeline-playhead" id="playhead"></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="panel-row">
        <button class="btn-accent" id="play-btn" onclick="togglePlay()">▶ PLAY</button>
        <button onclick="stopPlay()">⏹ STOP / RESET</button>
      </div>
    </div>
  </div>

  <script>
    const members = [
      { id: 'chaeryeong', name: 'Chaeryeong', role: 'MAIN DANCER, LEAD VOCAL', color: '#ff00aa', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80', seconds: 0 },
      { id: 'lia', name: 'Lia', role: 'MAIN VOCALIST', color: '#ccff00', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80', seconds: 0 },
      { id: 'yeji', name: 'Yeji', role: 'LEADER, MAIN DANCER', color: '#ffbb00', img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80', seconds: 0 },
      { id: 'yuna', name: 'Yuna', role: 'LEAD DANCER, LEAD VOCAL', color: '#00ff88', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80', seconds: 0 },
      { id: 'ryujin', name: 'Ryujin', role: 'MAIN RAPPER, LEAD DANCER', color: '#ff3333', img: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80', seconds: 0 }
    ];

    const chatPhrases = ["STAN {NAME}!", "SLAY DIVA! ✨", "ATE AND LEFT NO CRUMBS 💅", "MAIN VOCAL SERVING! 🔥", "QUEEN MOMENT 👑"];
    const totalSongDuration = 120.0;
    let songTimeline = [
      { id: 1, start: 0, end: 12, singer: null },
      { id: 2, start: 12, end: 28, singer: 'chaeryeong' },
      { id: 3, start: 28, end: 44, singer: 'lia' },
      { id: 4, start: 44, end: 58, singer: 'yeji' },
      { id: 5, start: 58, end: 65, singer: null },
      { id: 6, start: 65, end: 82, singer: 'yuna' },
      { id: 7, start: 82, end: 98, singer: 'ryujin' },
      { id: 8, start: 98, end: 120, singer: 'chaeryeong' }
    ];

    let currentTime = 0, isPlaying = false, timerInterval = null;
    const fullTimeline = document.getElementById('full-timeline'), videoElem = document.getElementById('itzy-video');

    function loadVideo(e) { const file = e.target.files[0]; if (file) videoElem.src = URL.createObjectURL(file); }
    function renderTimeline() {
      fullTimeline.innerHTML = '<div class="timeline-playhead" id="playhead"></div>';
      songTimeline.forEach(seg => {
        if (!seg.singer) return;
        const mem = members.find(m => m.id === seg.singer);
        if (!mem) return;
        const div = document.createElement('div');
        div.className = 'timeline-segment';
        div.style.left = `${(seg.start / totalSongDuration) * 100}%`;
        div.style.width = `${((seg.end - seg.start) / totalSongDuration) * 100}%`;
        div.style.background = mem.color;
        div.oncontextmenu = (e) => { e.preventDefault(); seg.singer = null; renderTimeline(); updateDisplay(); };
        fullTimeline.appendChild(div);
      });
    }

    function renderStage() {
      const stage = document.getElementById('itzy-stage'); stage.innerHTML = '';
      members.forEach(m => {
        const item = document.createElement('div');
        item.className = 'itzy-member-item'; item.id = `item-${m.id}`;
        item.innerHTML = `<div class="itzy-mem-info"><img class="itzy-mem-avatar" src="${m.img}"><div><div class="itzy-mem-name">${m.name}</div><div class="itzy-mem-sub">${m.role}</div></div></div><div class="itzy-time-pill" id="time-${m.id}">0.0</div>`;
        stage.appendChild(item);
      });
    }

    function updateText() {
      document.getElementById('display-badge').innerText = document.getElementById('in-badge').value || 'ITZY';
      document.getElementById('display-nowplaying').innerText = document.getElementById('in-nowplaying').value || 'ITZY - UNTOUCHABLE';
      document.getElementById('display-group').innerText = document.getElementById('in-group').value || 'I T Z Y';
      document.getElementById('display-footer').innerText = document.getElementById('in-badge').value || 'ITZY';
      document.getElementById('display-title').innerText = document.getElementById('in-title').value || 'UNTOUCHABLE';
      document.getElementById('display-tag-group').innerText = document.getElementById('in-badge').value || 'ITZY';
      document.getElementById('display-tag').innerText = document.getElementById('in-tag').value || 'LINE DISTRIBUTION';
    }

    function updateDisplay() {
      const playheadElem = document.getElementById('playhead');
      if (playheadElem) playheadElem.style.left = `${(currentTime / totalSongDuration) * 100}%`;
      const currentSegment = songTimeline.find(s => currentTime >= s.start && currentTime < s.end);
      const activeSingerId = currentSegment ? currentSegment.singer : null;
      const accTimes = {}; members.forEach(m => accTimes[m.id] = 0);
      songTimeline.forEach(seg => {
        if (!seg.singer) return;
        if (currentTime >= seg.end) accTimes[seg.singer] += (seg.end - seg.start);
        else if (currentTime > seg.start && currentTime < seg.end) accTimes[seg.singer] += (currentTime - seg.start);
      });
      members.forEach(m => m.seconds = accTimes[m.id]);
      const sorted = [...members].sort((a, b) => b.seconds - a.seconds);
      sorted.forEach((m, index) => {
        const item = document.getElementById(`item-${m.id}`);
        if (item) {
          item.style.order = index;
          document.getElementById(`time-${m.id}`).innerText = m.seconds.toFixed(1);
          if (m.id === activeSingerId) item.classList.add('is-singing'); else item.classList.remove('is-singing');
        }
      });
      const cutout = document.getElementById('itzy-cutout-img'), chat = document.getElementById('itzy-chat-card');
      if (activeSingerId) {
        const activeMem = members.find(m => m.id === activeSingerId);
        if (activeMem) {
          cutout.src = activeMem.img; cutout.classList.add('visible');
          document.getElementById('itzy-chat-img').src = activeMem.img;
          document.getElementById('itzy-chat-name').innerText = activeMem.name;
          document.getElementById('itzy-chat-text').innerText = chatPhrases[Math.floor(activeMem.name.length + currentTime) % chatPhrases.length].replace('{NAME}', activeMem.name);
          chat.classList.add('visible');
        }
      } else { cutout.classList.remove('visible'); chat.classList.remove('visible'); }
    }

    function togglePlay() { if (isPlaying) pausePlay(); else startPlay(); }
    function startPlay() { isPlaying = true; document.getElementById('play-btn').innerText = '⏸ PAUSE'; if (videoElem) videoElem.play(); timerInterval = setInterval(() => { currentTime += 0.1; if (currentTime >= totalSongDuration) stopPlay(); updateDisplay(); }, 100); }
    function pausePlay() { isPlaying = false; document.getElementById('play-btn').innerText = '▶ PLAY'; if (videoElem) videoElem.pause(); clearInterval(timerInterval); }
    function stopPlay() { pausePlay(); currentTime = 0; if (videoElem) videoElem.currentTime = 0; updateDisplay(); }

    renderStage(); renderTimeline(); updateDisplay();
  </script>
</body>
</html>
